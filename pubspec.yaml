name: flutter_foodstore
description: "Aplikasi E-Commerce FoodStore berbasis Flutter & Laravel REST API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  either_dart: ^1.0.0
  flutter_bloc: ^9.0.1
  flutter_secure_storage: ^9.2.4
  flutter_widget_from_html: ^0.15.3
  go_router: ^14.8.1
  image_picker: ^1.1.2
  intl: ^0.20.1
  webview_flutter: ^4.10.0
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
